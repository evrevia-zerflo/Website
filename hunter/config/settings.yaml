database_url: "sqlite:///data/sqlite.db"
playwright:
  headless: true
  max_concurrent_domains: 2
  delay_between_requests_sec: 3
  timeout_sec: 30
limits:
  max_products_per_supplier: 150
  detail_cache_hours: 24
  cache_retention_days: 7
  comparison_cache_days: 3
  max_comparison_seconds: 60
  shortlist_a: 25
  shortlist_b: 15
  shortlist_c: 10
  cooldown_days: 14
  cooldown_override_price_drop_pct: 15
ai:
  gemini_daily_limit: 20
  gemini_reserve: 8
  openrouter_rpm: 10
  openrouter_rpd: 200
  openrouter_models:
    - "openrouter/free"
