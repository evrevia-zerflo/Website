[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evrevia-product-hunter"
version = "0.1.0"
description = "Automated product hunter and scorer for EVRÉVIA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.9.0",
    "tenacity>=8.2.0",
    "Pillow>=10.0.0",
    "rapidfuzz>=3.5.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "httpx>=0.25.0",
    "loguru>=0.7.2",
    "selectolax>=0.3.17",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
hunter = "hunter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hunter"]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
vision = ["ImageHash>=4.3.1"]
